[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hp3458diag"
version = "0.9.7"
description = "HP 3458A noise diagnosis over GPIB: measurement plan, raw-data archive, report"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
hardware = ["pyvisa>=1.14,<2"]
gui = ["PySide6>=6.6,<7", "pyqtgraph>=0.13,<1", "numpy>=1.26,<3"]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]

[project.scripts]
hp3458diag = "hp3458diag.cli:main"
hp3458diag-gui = "hp3458diag.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["hardware: manual opt-in hardware integration tests; never run in normal CI"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
